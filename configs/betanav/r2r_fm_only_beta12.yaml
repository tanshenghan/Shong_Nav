# Frozen original LightNav + fresh FM expert; Beta(1, 2) time sampling on eight GPUs.
training_mode: fm_only
num_epochs: 3  # max_steps is derived from the distributed loader, including tail batches
dataset_root: /mnt/cfs/data/beta_nav/lerobot_r2r_train_470x280_20260912
model_path: /mnt/cfs/Models/Light
data_manifest: configs/betanav/data/r2r_all_train_20260913.json
output_dir: /mnt/cfs/Models/beta_nav/r2r_fm_only_beta12_frozen_lightnav_20260917
seed: 42
batch_size: 64  # real 82-frame history: 67.1 GiB allocated / 88.5 GiB reserved on one GPU
gradient_accumulation_steps: 1  # effective batch = 64 * 8 GPUs = 512
max_steps: 3699  # 3 * ceil(ceil(631244 / 8) / 64); recomputed from the loader
warmup_steps: 1000
lr_vlm: 1.0e-5
lr_fm: 1.0e-4
min_lr_ratio: 0.1
weight_decay: 0.01
adam_betas: [0.9, 0.95]
adam_eps: 1.0e-8
clip_vlm: 1.0
clip_fm: 1.0
lambda_fm: 1.0  # FM-only objective: 1.0 * FM
flow_time_distribution: beta
flow_time_alpha: 1.0
flow_time_beta: 2.0  # tau=0 is noise; P(tau <= 0.3)=0.51
freeze_vision: true
gradient_checkpointing: false  # frozen VLM runs under no_grad; no backward activations
mixed_precision: bf16
optimizer: zero1
expert_hidden_size: 512
expert_num_layers: 6
expert_num_heads: 8
expert_intermediate_size: 2048
expert_dropout: 0.0
num_flow_steps: 10
num_workers: 4  # 32 CPU workers across eight GPUs to prepare larger batches
prefetch_factor: 1
log_every: 10
eval_every: 0  # training only; do not build or run the validation loader
eval_max_batches: 64
eval_sample_batches: 4
save_every: 1000  # rolling full model + per-rank Adam/RNG state
model_save_every: 3000  # permanent model-only archive from the same snapshot
checkpoint_mode: dual  # both writes run in the background; no ZeRO state consolidation
keep_last: 3
save_best: false
tracker: none  # JSONL always enabled; tensorboard / wandb optional
